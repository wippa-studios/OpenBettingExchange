name: CI

# This project exists so that an OUTSIDE reader can check the money path. Tests
# that only run on one laptop are the opposite of that, so CI is not
# convenience here — it is the claim.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default-deny. Pinning an action to a SHA stops it being swapped; this stops
# the pinned action doing anything it does not need to. Every job here only
# reads the repository. The gitleaks job is the one exception and says so
# explicitly below, because it needs to write a PR comment.
permissions:
  contents: read

# A superseded run is wasted compute on a queue nobody is watching.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Action pinning ─────────────────────────────────────────────────────────
# Every `uses:` below is pinned to a full commit SHA, not a tag. A tag is a
# mutable pointer: `actions/checkout@v4` resolves to whatever v4 points at when
# the job runs, so a retagged or compromised action revision executes with this
# workflow's permissions. The SHA is the only immutable reference.
#
# The comment on each pin names the version it corresponds to. Without it the
# next person sees an opaque hash, cannot tell what they are pinned to, and has
# no reason not to "tidy" it back to a tag. `.github/dependabot.yml` has a
# github-actions ecosystem configured precisely so these pins get upgraded by a
# bot that rewrites both the SHA and the version comment.
#
# These were bumped off @v4 at the same time, and that was not cosmetic:
# actions/checkout v4 and actions/setup-node v4 are node20 actions, and GitHub
# removed Node 20 from hosted runners on 2026-09-16. Pinning a dead runtime to a
# SHA would have been pinning something that cannot run. v7 is node24 for both.

jobs:
  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from package.json engines, and current LTS. node:sqlite is
        # still moving, so the matrix is the early warning that a release broke
        # it BEFORE an operator finds out.
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Unit + API integration (offline)
        run: npm test

      - name: Live end-to-end smoke
        run: npm run test:smoke

      - name: Operational surface (backup/restore, rate limits)
        run: node tests/ops.test.js

  browser:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser suite
        run: npm run test:ui

  # Guardrails that do not need a full test run. Cheap, and they catch the
  # class of change that quietly breaks the project's central promise.
  guards:
    name: Repository guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # Required, not optional: the docs check below EXECUTES `npm test` to
      # count the checks it compares against the README. Without dependencies
      # installed, suites needing express/pg die on require, the runner reports
      # a partial count, and the checker concluded the docs were wrong. That is
      # how CI went red for three commits with README.md telling the truth.
      - run: npm ci

      - name: Escrow invariant is enforced, not just commented
        # The escrow invariant rests on orders.frozen_cents being owned by the
        # matching engine. tests/guard.test.js proves it, but it runs inside
        # npm test where a reader may not notice it. Surfaced on its own so a
        # PR that quietly widens the allowlist gets a named failure.
        run: node tests/guard.test.js

      - name: No committed credentials
        run: |
          # Betfair bot login keys are the specific risk in this project's
          # history: a companion recorder with private keys sits in the working
          # tree. Assert the directory is not tracked rather than trusting a
          # .gitignore that can be edited in the same PR.
          if git ls-files --error-unmatch betfair-market-snapshots >/dev/null 2>&1; then
            echo "::error::betfair-market-snapshots is tracked; it contains bot login keys"
            exit 1
          fi
          if git ls-files | grep -E '\.(key|pem|p12)$'; then
            echo "::error::private key material is committed"
            exit 1
          fi

      - name: .gitignore still refuses the credential files
        # The step above is a backstop: it fails AFTER a file is staged and only
        # matches by extension, so it cannot see .netrc or pgpass (bare
        # name==password files with no extension at all). This one asks git
        # itself whether the rules still exclude the paths — and, in the same
        # run, whether they still leave .env.example and ordinary source
        # committable. That second half is what keeps it from being satisfied by
        # an over-broad rule. See #12.
        run: node scripts/check-gitignore.mjs

      # The step above checks for key FILES. The actual incident was a credential
      # VALUE pasted into an ordinary .js test fixture as "obviously fake sample
      # data" — a live Betfair app key and username, committed and pushed to a
      # PUBLIC repository. A filename check cannot see that; a value check can.
      #
      # Honest limitation, stated so nobody over-trusts it: CI has no .env, so
      # here it verifies the script runs and finds nothing. Its teeth are on the
      # operator's machine (`npm run check:secrets`). Covering history and CI
      # properly wants a real scanner (gitleaks/trufflehog) over full history.
      - name: Secret scanner runs (value check needs a local .env)
        # Renamed from "No credential value from .env is committed", which named
        # a check this step cannot perform. scripts/check-no-secrets.mjs compares
        # against values in a .env file, and CI has no .env, so it finds nothing
        # and exits 0 unconditionally. Deleting the script outright would leave
        # this step green. The new name says what actually happens. The real
        # coverage for this project is the gitleaks job below, which reads every
        # commit rather than the working tree.
        #
        # The teeth are still real on an operator's machine: `npm run
        # check:secrets` in a checkout that has a .env.
        run: node scripts/check-no-secrets.mjs

      - name: No stray large files
        run: |
          # node_modules, a database, or a screenshot dump would bloat history
          # irreversibly. 5MB is generous for source and assets in this repo.
          big=$(git ls-files -z | xargs -0 -I{} sh -c 'test -f "{}" && stat -c%s "{}"' 2>/dev/null | awk '$1 > 5242880 {print}')
          if [ -n "$big" ]; then echo "::error::files over 5MB tracked"; exit 1; fi

      - name: Docs do not contradict the code
        # The review found the README claiming cash-out was a market hedge (it
        # is a venue buyout), that a shipped results feed did not exist, and a
        # stale table count and test count. Numbers that drift from the code
        # are the specific failure this prevents.
        run: node scripts/check-docs.mjs

      - name: .env.example documents every key the code reads
        # .env.example covered 15 of the 58 keys the server actually reads, and
        # nothing was checking. Several of the missing ones fail CLOSED —
        # FEED_CREDENTIALS_KEY unset means the venue refuses to store a
        # credential, OPS_TOKEN unset means /metrics 404s — so an operator finds
        # out by being surprised rather than by reading documentation. #5.
        #
        # The surface is extracted from lib/config.js and server.js rather than
        # listed here, so adding a knob makes this fail until it is documented,
        # and the check refuses to report success if it cannot parse its source
        # or finds .env.example gutted.
        run: node scripts/check-env-example.mjs

      - name: CI actions are pinned to SHAs, not tags
        # The pins at the top of this file are the control; this is what keeps
        # them. A tag is mutable — the revision that runs is whatever upstream
        # points at when the job starts — and a pin is easy to "tidy" back to a
        # tag. It also requires the version comment beside each SHA, because a
        # bare 40-character hash tells the next reader nothing and gives them no
        # reason not to change it. Dependabot's github-actions ecosystem is
        # configured to update both together. #10.
        run: node scripts/check-action-pins.mjs

  # A capacity smoke, not a benchmark: it asserts the system survives concurrent
  # writes with the books still balanced, which is a correctness property and
  # belongs in CI. Absolute rps is machine-dependent and is NOT asserted —
  # pinning a number here would fail on a slower runner for no real reason.
  load:
    name: Load smoke (concurrent writes, books balanced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/load-test.mjs --orders 600 --concurrency 25

  # The control whose absence already cost this project once. Commit 9eac3a4 put
  # a live Betfair app key, username and password into three test fixtures in a
  # PUBLIC repository. Commit 173a68b removed them — with an ordinary follow-up
  # commit, not a history rewrite — so they are still readable with `git log -p`
  # today. The guard that existed at the time matched key FILES by extension, and
  # a credential VALUE inside a tracked .js is not a file, so nothing fired.
  # scripts/check-no-secrets.mjs came afterwards and is honest that it cannot
  # see this. gitleaks reads every commit, which is the only thing that does.
  #
  # TWO JOBS, AND WHY THEY ARE NOT ONE.
  #
  # `secrets` is BLOCKING and scans only commits after HISTORY_SCAN_BASELINE. It
  # is the control that stops the next one. It is red for the second this history
  # has leaked a credential and nothing has caught it.
  #
  # `secrets-history` is ADVISORY and scans all of history, `continue-on-error`.
  # It reports the 9eac3a4 credential, and that finding is correct.
  #
  # Merging those two into a single blocking job over full history was the first
  # version of this file, and it was wrong. A check that is red on every single
  # run stops being a signal: people read CI as "known-broken", the red becomes
  # wallpaper, and the moment a NEW secret lands it arrives as the twentieth red
  # mark rather than as news. Shipping a permanently failing check is the same
  # mistake as shipping no check, with more maintenance.
  #
  # So the historical finding is kept visible and kept NON-blocking, and the
  # guard on new commits is what actually fails the build. The two are separate
  # jobs precisely so neither has to compromise the other.
  #
  # .gitleaks.toml allowlists only the four synthetic fixture literals the test
  # suites authenticate with. Widening it to silence the real one would mean
  # committing the leaked value to the working tree — the exact failure this
  # scanner exists to prevent. See the long note at the bottom of .gitleaks.toml.
  #
  # REMOVING HISTORY_SCAN_BASELINE is the real fix for the advisory job, and it
  # needs two things only the credential's owner can do: rotate the Betfair key,
  # and rewrite history. Neither is a code change.
  secrets:
    name: Secret scan (new commits — blocking)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is what makes this a commit scan at all. The default
      # checkout is a shallow single commit, so a range scan would have an empty
      # history to walk and would report nothing while looking like a pass.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        # gitleaks-action CANNOT do this job. Its v3 action.yml takes no inputs at
        # all — configuration is environment-only and the scan always covers the
        # whole history — so there is no way to ask it for "commits since X". The
        # binary is installed here instead, pinned to a version and verified by
        # checksum, because an unpinned download would reintroduce exactly the
        # supply-chain risk the SHA pins elsewhere in this file exist to remove.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          ARCH="$(uname -m | sed 's/x86_64/x64/; s/aarch64/arm64/')"
          FILE="gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Download the archive UNDER THE NAME THE CHECKSUM FILE USES. It is
          # saved as a file in the working directory first and renamed here;
          # verifying first and renaming after fails with "No such file or
          # directory", because `sha256sum -c` resolves the name it reads from
          # the list against the current directory, not against the download.
          curl -sSfL "${BASE}/${FILE}" -o "${FILE}"
          curl -sSfL "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o sums.txt
          # Verify BEFORE extracting. Unpacking first would put an unverified
          # binary on disk for anything else on the runner to find.
          grep " ${FILE}\$" sums.txt | sha256sum --check --strict
          mkdir -p "$HOME/bin"
          tar -xzf "${FILE}" -C "$HOME/bin" gitleaks
          chmod +x "$HOME/bin/gitleaks"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          gitleaks version

      - name: No secret in any commit since the baseline
        run: |
          gitleaks detect \
            --redact \
            --no-banner \
            --log-opts="${HISTORY_SCAN_BASELINE}..HEAD" \
            --config .gitleaks.toml \
            --verbose
        env:
          HISTORY_SCAN_BASELINE: 4b58267bcc0c8f4326ab777383a95f559fcbcf58

  secrets-history:
    name: Secret scan (full history — advisory, known finding in 9eac3a4)
    runs-on: ubuntu-latest
    # Advisory on purpose. The finding is real and already public; failing every
    # run on it would not make it any more true, and it would mask new findings.
    continue-on-error: true
    permissions:
      contents: read
      # gitleaks-action posts the finding as a review comment on the PR.
      pull-requests: write
    steps:
      # fetch-depth: 0 is what makes this a HISTORY scan. The default checkout is
      # a shallow single commit, which would make the scanner report nothing and
      # look like it had passed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm audit --audit-level=high